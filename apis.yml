aid: hello-patient
name: Hello Patient
description: Hello Patient builds AI agents (branded "Mia") for patient conversations
  across voice, text, and web chat, helping healthcare practices automate their front
  office, back office, and patient-growth workflows. Mia handles 24/7 appointment scheduling,
  insurance verification, and patient intake on the front office; revenue-cycle (RCM)
  follow-up and no-show recovery on the back office; and lead conversion, patient recall,
  and targeted outreach for growth. The platform serves dentistry, dermatology, ENT,
  mental health, optometry, primary care, urgent care, veterinary, and consumer-health
  practices, and integrates with EHR and practice systems including ModMed, AdvancedMD,
  NextGen, eClinicalWorks, Athena Health, Veradigm, Zenoti, and others. Hello Patient
  is HIPAA compliant and SOC 2 Type 2 certified. It is backed by 8VC and Scale Venture
  Partners. No public developer API is documented at this time; this profile is maintained
  by the API Evangelist network.
